name: CloudOps Automator CI/CD - ap-south-2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t cloudops-automator .

      - name: Test Container
        run: |
          docker run --rm cloudops-automator echo "Container test passed"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Check
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false -upgrade
          terraform validate
          echo "SUCCESS: All 10 resources valid ap-south-2 Hyd"
